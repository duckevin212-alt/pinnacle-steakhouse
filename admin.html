<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị - Pinnacle Prime Steakhouse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#FBF9F5] text-[#2C2A29] min-h-screen flex">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-[#344E41] text-[#FBF9F5] flex flex-col shadow-2xl z-20 hidden md:flex fixed h-full">
        <div class="h-24 flex items-center justify-center border-b border-[#2C4035]">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-crown text-2xl text-[#EAE3D2]"></i>
                <div class="flex flex-col">
                    <span class="text-lg font-black tracking-wider text-white">PINNACLE</span>
                    <span class="text-[9px] uppercase tracking-widest text-[#EAE3D2] font-bold">Admin Portal</span>
                </div>
            </div>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-[#2C4035] text-white font-bold transition-all shadow-inner">
                <i class="fa-solid fa-chart-pie w-5"></i> Tổng Quan
            </button>
            <button onclick="switchTab('dishes')" id="tab-dishes" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-[#2C4035] text-slate-300 hover:text-white font-semibold transition-all">
                <i class="fa-solid fa-utensils w-5"></i> Quản lý Thực Đơn
            </button>
            <button onclick="switchTab('reservations')" id="tab-reservations" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-[#2C4035] text-slate-300 hover:text-white font-semibold transition-all">
                <i class="fa-solid fa-calendar-check w-5"></i> Quản lý Đặt Bàn
            </button>
        </nav>
        <div class="p-4 border-t border-[#2C4035]">
            <a href="index.html" target="_blank" class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-[#F4EFE6] text-[#344E41] hover:bg-white font-bold transition-all text-sm">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> Xem Trang Chủ
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 md:ml-64 min-h-screen flex flex-col">
        <header class="h-24 bg-white border-b border-[#EAE3D2] flex items-center justify-between px-8 shadow-sm">
            <h2 id="page-title" class="text-2xl font-black text-[#2C2A29]">Bảng Thống Kê Tổng Quan</h2>
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-[#F4EFE6] flex items-center justify-center text-[#344E41] border border-[#EAE3D2]">
                    <i class="fa-solid fa-user-tie"></i>
                </div>
                <div class="hidden sm:block">
                    <p class="text-sm font-bold text-[#2C2A29]">Admin Đỉnh Cao</p>
                    <p class="text-xs text-[#5A5552]">System Manager</p>
                </div>
            </div>
        </header>

        <div class="p-8 flex-1 overflow-y-auto">
            
            <!-- 0. DASHBOARD SECTION -->
            <div id="dashboard-section" class="space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white border border-[#EAE3D2] rounded-3xl p-6 shadow-lg flex items-center gap-5">
                        <div class="w-14 h-14 rounded-2xl bg-green-100 text-green-600 flex items-center justify-center text-2xl">
                            <i class="fa-solid fa-sack-dollar"></i>
                        </div>
                        <div>
                            <p class="text-xs uppercase font-bold text-[#5A5552] tracking-wider">Tổng Doanh Thu</p>
                            <h3 id="stat-revenue" class="text-2xl font-black text-[#2C2A29] mt-1">0đ</h3>
                        </div>
                    </div>
                    <div class="bg-white border border-[#EAE3D2] rounded-3xl p-6 shadow-lg flex items-center gap-5">
                        <div class="w-14 h-14 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-2xl">
                            <i class="fa-solid fa-book-open"></i>
                        </div>
                        <div>
                            <p class="text-xs uppercase font-bold text-[#5A5552] tracking-wider">Đơn Đang Chờ</p>
                            <h3 id="stat-pending" class="text-2xl font-black text-[#2C2A29] mt-1">0</h3>
                        </div>
                    </div>
                    <div class="bg-white border border-[#EAE3D2] rounded-3xl p-6 shadow-lg flex items-center gap-5">
                        <div class="w-14 h-14 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center text-2xl">
                            <i class="fa-solid fa-bell-concierge"></i>
                        </div>
                        <div>
                            <p class="text-xs uppercase font-bold text-[#5A5552] tracking-wider">Món Ăn Trên Menu</p>
                            <h3 id="stat-dishes" class="text-2xl font-black text-[#2C2A29] mt-1">0</h3>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 1. QUẢN LÝ MÓN ĂN -->
            <div id="dishes-section" class="hidden space-y-8">
                <div class="bg-white border border-[#EAE3D2] rounded-3xl p-6 md:p-8 shadow-lg">
                    <h3 class="text-lg font-bold text-[#344E41] mb-6 flex items-center gap-2"><i class="fa-solid fa-plus-circle"></i> Thêm Món Mới</h3>
                    <form id="dish-form" onsubmit="handleDishSubmit(event)" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <input type="hidden" id="dish-id">
                        <div>
                            <label class="block text-xs font-bold uppercase text-[#5A5552] mb-2">Tên món ăn</label>
                            <input type="text" id="dish-name" required placeholder="VD: Bò Wagyu A5" class="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-[#EAE3D2] text-sm text-[#2C2A29] focus:outline-none focus:border-[#344E41]">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-[#5A5552] mb-2">Giá tiền (VNĐ)</label>
                            <input type="number" id="dish-price" required class="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-[#EAE3D2] text-sm text-[#2C2A29] focus:outline-none focus:border-[#344E41]">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-[#5A5552] mb-2">Danh mục</label>
                            <select id="dish-category" class="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-[#EAE3D2] text-sm text-[#2C2A29] focus:outline-none focus:border-[#344E41]">
                                <option value="main">Món chính</option>
                                <option value="snack">Khai vị</option>
                                <option value="drink">Đồ uống</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-[#5A5552] mb-2">Link Ảnh</label>
                            <input type="url" id="dish-image" required class="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-[#EAE3D2] text-sm text-[#2C2A29] focus:outline-none focus:border-[#344E41]">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold uppercase text-[#5A5552] mb-2">Mô tả</label>
                            <textarea id="dish-desc" rows="2" class="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-[#EAE3D2] text-sm text-[#2C2A29] focus:outline-none focus:border-[#344E41] resize-none"></textarea>
                        </div>
                        <div class="md:col-span-2 flex justify-end gap-3">
                            <button type="button" onclick="resetDishForm()" class="px-6 py-3 rounded-xl bg-[#F4EFE6] text-[#5A5552] font-bold text-xs uppercase transition-all">Hủy</button>
                            <button type="submit" class="px-8 py-3 rounded-xl bg-[#344E41] hover:bg-[#2C4035] text-white font-bold text-xs uppercase transition-all">Lưu Món</button>
                        </div>
                    </form>
                </div>

                <div class="bg-white border border-[#EAE3D2] rounded-3xl shadow-lg overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-[#F4EFE6] text-[#344E41] text-xs uppercase tracking-wider">
                                    <th class="p-4 font-bold">Hình ảnh</th>
                                    <th class="p-4 font-bold">Tên Món</th>
                                    <th class="p-4 font-bold">Giá Tiền</th>
                                    <th class="p-4 font-bold text-right">Thao Tác</th>
                                </tr>
                            </thead>
                            <tbody id="admin-dish-list" class="text-sm divide-y divide-[#EAE3D2]"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 2. QUẢN LÝ ĐẶT BÀN -->
            <div id="reservations-section" class="hidden space-y-8">
                <div class="bg-white border border-[#EAE3D2] rounded-3xl shadow-lg overflow-hidden">
                    <div class="p-6 border-b border-[#EAE3D2] flex justify-between items-center bg-[#FBF9F5]">
                        <h3 class="text-lg font-bold text-[#344E41]"><i class="fa-solid fa-clipboard-list mr-2"></i> Danh Sách Đơn Đặt Bàn</h3>
                        <button onclick="fetchReservations()" class="px-4 py-2 bg-white border border-[#EAE3D2] rounded-lg text-xs font-bold text-[#344E41] hover:bg-[#EAE3D2] transition-all shadow-sm"><i class="fa-solid fa-rotate-right mr-1"></i> Làm mới</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-[#F4EFE6] text-[#344E41] text-xs uppercase tracking-wider">
                                    <th class="p-4 font-bold">Trạng Thái</th>
                                    <th class="p-4 font-bold">Khách Hàng</th>
                                    <th class="p-4 font-bold">Thời Gian</th>
                                    <th class="p-4 font-bold">Chi Tiết Đơn Hàng</th>
                                    <th class="p-4 font-bold text-right">Xử Lý Đơn</th>
                                </tr>
                            </thead>
                            <tbody id="admin-reservation-list" class="text-sm divide-y divide-[#EAE3D2]"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- JAVASCRIPT -->
    <script>
        const API_BASE = '/api';

        function switchTab(tab) {
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('dishes-section').classList.add('hidden');
            document.getElementById('reservations-section').classList.add('hidden');
            
            const btnClass = 'w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-[#2C4035] text-slate-300 hover:text-white font-semibold transition-all';
            const activeClass = 'w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-[#2C4035] text-white font-bold transition-all shadow-inner';
            
            document.getElementById('tab-dashboard').className = btnClass;
            document.getElementById('tab-dishes').className = btnClass;
            document.getElementById('tab-reservations').className = btnClass;

            if(tab === 'dashboard') {
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('tab-dashboard').className = activeClass;
                document.getElementById('page-title').innerText = 'Bảng Thống Kê Tổng Quan';
                fetchDashboardStats();
            } else if(tab === 'dishes') {
                document.getElementById('dishes-section').classList.remove('hidden');
                document.getElementById('tab-dishes').className = activeClass;
                document.getElementById('page-title').innerText = 'Quản lý Thực Đơn';
                fetchDishes();
            } else {
                document.getElementById('reservations-section').classList.remove('hidden');
                document.getElementById('tab-reservations').className = activeClass;
                document.getElementById('page-title').innerText = 'Quản lý Đặt Bàn';
                fetchReservations();
            }
        }

        async function fetchDashboardStats() {
            try {
                const resDishes = await fetch(`${API_BASE}/dishes`);
                const dishes = await resDishes.json();
                document.getElementById('stat-dishes').innerText = dishes.length || 0;

                const resBookings = await fetch(`${API_BASE}/reservations`);
                const bookings = await resBookings.json();
                
                let pendingCount = 0;
                let totalRevenue = 0;
                if(bookings.length > 0) {
                    bookings.forEach(b => {
                        if(b.status === 'pending') pendingCount++;
                        if(b.status === 'completed') totalRevenue += Number(b.total_amount || 0); // Chỉ tính tiền đơn hoàn thành
                    });
                }
                document.getElementById('stat-pending').innerText = pendingCount;
                document.getElementById('stat-revenue').innerText = totalRevenue.toLocaleString('vi-VN') + 'đ';

            } catch (err) { console.error("Lỗi lấy dữ liệu:", err); }
        }

        // ... [Giữ nguyên các hàm fetchDishes, handleDishSubmit, editDish, deleteDish, resetDishForm] ...
        // Bắt đầu chèn code cũ:
        async function fetchDishes() {
            try {
                const res = await fetch(`${API_BASE}/dishes`);
                const dishes = await res.json();
                const tbody = document.getElementById('admin-dish-list');
                if(!dishes || dishes.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center p-8 text-[#5A5552] italic">Trống.</td></tr>`;
                    return;
                }
                tbody.innerHTML = dishes.map(dish => `
                    <tr class="hover:bg-[#FBF9F5] transition-colors">
                        <td class="p-4"><img src="${dish.image}" class="w-16 h-16 object-cover rounded-xl shadow-sm border border-[#EAE3D2]"></td>
                        <td class="p-4 font-bold text-[#2C2A29]">${dish.name}</td>
                        <td class="p-4 font-bold text-[#344E41]">${Number(dish.price).toLocaleString('vi-VN')}đ</td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick="editDish(${dish.id})" class="px-3 py-1.5 bg-[#F4EFE6] text-[#344E41] border border-[#EAE3D2] rounded-lg text-xs font-bold hover:bg-[#344E41] hover:text-white transition-all"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteDish(${dish.id})" class="px-3 py-1.5 bg-[#FBF9F5] text-red-500 border border-[#EAE3D2] rounded-lg text-xs font-bold hover:bg-red-500 hover:text-white transition-all"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) { console.error(err); }
        }

        async function handleDishSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('dish-id').value;
            const payload = {
                name: document.getElementById('dish-name').value,
                price: document.getElementById('dish-price').value,
                category: document.getElementById('dish-category').value,
                image: document.getElementById('dish-image').value,
                description: document.getElementById('dish-desc').value
            };
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_BASE}/dishes/${id}` : `${API_BASE}/dishes`;
            try {
                await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                resetDishForm(); fetchDishes();
                alert(id ? 'Cập nhật món thành công!' : 'Thêm món thành công!');
            } catch (err) { alert('Lỗi thao tác với Server!'); }
        }

        async function editDish(id) {
            try {
                const res = await fetch(`${API_BASE}/dishes`);
                const dishes = await res.json();
                const dish = dishes.find(d => d.id === id);
                if (dish) {
                    document.getElementById('dish-id').value = dish.id;
                    document.getElementById('dish-name').value = dish.name;
                    document.getElementById('dish-price').value = dish.price;
                    document.getElementById('dish-category').value = dish.category;
                    document.getElementById('dish-image').value = dish.image;
                    document.getElementById('dish-desc').value = dish.description;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            } catch (err) { console.error(err); }
        }

        async function deleteDish(id) {
            if(!confirm('Bạn có chắc muốn xóa món này?')) return;
            try {
                await fetch(`${API_BASE}/dishes/${id}`, { method: 'DELETE' });
                fetchDishes();
            } catch (err) { alert('Lỗi xóa món!'); }
        }

        function resetDishForm() {
            document.getElementById('dish-form').reset();
            document.getElementById('dish-id').value = '';
        }
        // Kết thúc code cũ

        // HÀM HIỂN THỊ ĐẶT BÀN MỚI TÍCH HỢP TRẠNG THÁI
        async function fetchReservations() {
            try {
                const res = await fetch(`${API_BASE}/reservations`);
                const data = await res.json();
                const tbody = document.getElementById('admin-reservation-list');
                if(!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center p-8 text-[#5A5552] italic">Chưa có đơn đặt bàn nào.</td></tr>`;
                    return;
                }
                tbody.innerHTML = data.map(res => {
                    // Xử lý huy hiệu trạng thái
                    let statusBadge = '';
                    let actionBtns = '';
                    if (!res.status || res.status === 'pending') {
                        statusBadge = `<span class="px-3 py-1 bg-amber-100 text-amber-600 rounded-full text-[10px] font-black uppercase tracking-wider"><i class="fa-solid fa-hourglass-half mr-1"></i> Chờ duyệt</span>`;
                        actionBtns = `
                            <button onclick="updateStatus(${res.id}, 'confirmed')" class="px-3 py-1.5 bg-green-50 text-green-600 border border-green-200 rounded-lg text-xs font-bold hover:bg-green-600 hover:text-white transition-all w-full mb-1">Xác Nhận</button>
                            <button onclick="deleteReservation(${res.id})" class="px-3 py-1.5 bg-red-50 text-red-500 border border-red-200 rounded-lg text-xs font-bold hover:bg-red-500 hover:text-white transition-all w-full">Hủy / Xóa</button>
                        `;
                    } else if (res.status === 'confirmed') {
                        statusBadge = `<span class="px-3 py-1 bg-green-100 text-green-600 rounded-full text-[10px] font-black uppercase tracking-wider"><i class="fa-solid fa-check mr-1"></i> Đã chốt</span>`;
                        actionBtns = `
                            <button onclick="updateStatus(${res.id}, 'completed')" class="px-3 py-1.5 bg-blue-50 text-blue-600 border border-blue-200 rounded-lg text-xs font-bold hover:bg-blue-600 hover:text-white transition-all w-full mb-1">Hoàn Thành Đơn</button>
                            <button onclick="deleteReservation(${res.id})" class="px-3 py-1.5 bg-gray-100 text-gray-400 border border-gray-200 rounded-lg text-xs font-bold hover:bg-red-500 hover:text-white transition-all w-full">Xóa Khỏi Lịch</button>
                        `;
                    } else {
                        statusBadge = `<span class="px-3 py-1 bg-slate-200 text-slate-600 rounded-full text-[10px] font-black uppercase tracking-wider"><i class="fa-solid fa-flag-checkered mr-1"></i> Đã xong</span>`;
                        actionBtns = `<button onclick="deleteReservation(${res.id})" class="px-3 py-1.5 bg-gray-100 text-gray-500 border border-gray-200 rounded-lg text-xs font-bold hover:bg-gray-300 transition-all w-full">Lưu Trữ (Xóa)</button>`;
                    }

                    // Giải mã JSON giỏ hàng
                    let cartHtml = '';
                    if (res.cart_items && res.cart_items !== '[]') {
                        try {
                            const parsedItems = JSON.parse(res.cart_items);
                            cartHtml = `
                                <div class="mt-2 space-y-1 border-t border-[#EAE3D2] pt-2">
                                    <p class="text-[10px] uppercase font-bold text-[#5A5552]">Món ăn đã đặt:</p>
                                    <ul class="text-xs text-[#2C2A29] list-disc list-inside">
                                        ${parsedItems.map(item => `<li>${item.name} <span class="font-bold text-[#344E41]">(x${item.quantity})</span></li>`).join('')}
                                    </ul>
                                </div>`;
                        } catch (e) { }
                    }

                    return `
                        <tr class="hover:bg-[#FBF9F5] transition-colors border-b border-[#EAE3D2] ${res.status === 'completed' ? 'opacity-60' : ''}">
                            <td class="p-4">${statusBadge}</td>
                            <td class="p-4">
                                <p class="font-bold text-[#2C2A29]">${res.fullname}</p>
                                <p class="text-xs text-[#5A5552] mt-1"><i class="fa-solid fa-phone mr-1"></i> ${res.phone}</p>
                                <p class="text-xs text-[#5A5552]"><i class="fa-solid fa-users mr-1"></i> ${res.guests}</p>
                            </td>
                            <td class="p-4 text-[#5A5552]">
                                <span class="block font-bold text-[#2C2A29] text-sm">${res.booking_date}</span>
                                <span class="text-xs"><i class="fa-regular fa-clock"></i> ${res.booking_time}</span>
                            </td>
                            <td class="p-4 max-w-xs">
                                <p class="text-xs text-amber-600 font-medium mb-1 line-clamp-2">${res.note || 'Không có ghi chú'}</p>
                                ${res.total_amount > 0 ? `<p class="text-[11px] font-bold text-[#344E41] bg-[#344E41]/10 inline-block px-2 py-1 rounded mb-2 uppercase tracking-wider">Tổng đơn: ${Number(res.total_amount).toLocaleString()}đ</p>` : ''}
                                ${cartHtml}
                            </td>
                            <td class="p-4 align-top w-32">${actionBtns}</td>
                        </tr>`;
                }).join('');
            } catch (err) { console.error(err); }
        }

        // HÀM CẬP NHẬT TRẠNG THÁI
        async function updateStatus(id, status) {
            try {
                const res = await fetch(`${API_BASE}/reservations/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                if(!res.ok) throw new Error();
                fetchReservations();
            } catch (err) { alert('Lỗi cập nhật trạng thái!'); }
        }

        async function deleteReservation(id) {
            if(!confirm('Xác nhận xóa dữ liệu đặt bàn này?')) return;
            try {
                await fetch(`${API_BASE}/reservations/${id}`, { method: 'DELETE' });
                fetchReservations();
            } catch (err) { alert('❌ Không thể xóa đơn.'); }
        }

        window.addEventListener('DOMContentLoaded', fetchDashboardStats);
    </script>
</body>
</html>
